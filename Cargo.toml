[package]
authors = ["Darius C", "Rust-IPFS contributors"]
rust-version = "1.83"
edition = "2021"
license = "MIT OR Apache-2.0"
name = "rust-ipfs"
readme = "README.md"
repository = "https://github.com/dariusc93/rust-ipfs"
description = "IPFS node implementation"
version = "0.15.0"

[features]
default = ["full"]
full = ["stream", "dns", "tls", "noise", "tcp", "quic", "rsa", "ed25519", "secp256k1", "ecdsa", "websocket", "upnp"]

rsa = ["connexa/rsa", "rust-ipns/rsa"]
ed25519 = ["connexa/ed25519", "rust-ipns/ed25519"]
secp256k1 = ["connexa/secp256k1", "rust-ipns/secp256k1"]
ecdsa = ["connexa/ecdsa", "rust-ipns/ecdsa"]

stream = ["connexa/stream"]
upnp = ["connexa/upnp"]

dns = ["connexa/dns"]
tls = ["connexa/tls"]
noise = ["connexa/noise"]
tcp = ["connexa/tcp"]
quic = ["connexa/quic"]
pnet = ["connexa/pnet"]

webrtc = ["connexa/webrtc"]
websocket = ["connexa/websocket"]
webtransport = ["connexa/webtransport"]

test_go_interop = []
test_js_interop = []

[workspace.dependencies]
anyhow = "1.0.100"
async-rt = "0.1.8"
async-stream = { version = "0.3.6" }
async-trait = { version = "0.1.89" }
asynchronous-codec = "0.7.0"
base64 = { version = "0.22.1" }
bytes = "1.10.1"
cid = "0.11.1"
chrono = { version = "0.4.42" }
clap = { version = "4.5.48", features = ["derive"] }
connexa = { version = "0.4.1", features = ["identify", "dcutr", "gossipsub", "autonat", "relay", "kad", "keypair_base64_encoding", "ping", "request-response", "request-response-misc", "rendezvous", "mdns"] }
either = { version = "1.15.0" }
fs2 = "0.4.3"
futures = { version = "0.3.31" }
futures-timeout = "0.1.3"
futures-timer = "3.0.0"
getrandom = { version = "0.3.3" }
hickory-resolver = "0.25.2"
idb = "0.6.4"
indexmap = "2.11.4"
ipld-core = { version = "0.4.1", features = ["serde"] }
ipld-dagpb = "0.2.2"
libp2p-relay-manager = { version = "0.4.0", path = "packages/libp2p-relay-manager" }
multibase = "0.9.1"
multihash = "0.19.3"
multihash-codetable = { version = "0.1.4" }
multihash-derive = "0.9.1"
parking_lot = "0.12.4"
pollable-map = "0.1.7"
quick-protobuf = { version = "0.8.1" }
quick-protobuf-codec = "0.3.1"
rand = "0.9.2"
rcgen = { version = "0.13.2", features = ["pem", "x509-parser"] }
rlimit = "0.10.2"
rust-ipns = { version = "0.8.0", path = "packages/rust-ipns", default-features = false }
rust-unixfs = { version = "0.5.0", path = "unixfs" }
send_wrapper = "0.6.0"
serde = { version = "1.0.219" }
serde_ipld_dagcbor = "0.6.3"
serde_ipld_dagjson = "0.2.1"
serde_json = { version = "1.0.145" }
serde-wasm-bindgen = "0.6.5"
sha2 = "0.10.8"
simple_x509 = "=1.1.0"
thiserror = { version = "2.0.12" }
tracing = { version = "0.1.41" }
tracing-futures = { features = ["futures-03"], version = "0.2.5" }

tokio = { default-features = false, version = "1.46.1" }
tokio-stream = { default-features = false, version = "0.1.17" }
tokio-util = { default-features = false, version = "0.7.15" }
unsigned-varint = { version = "0.8.0", features = ["asynchronous_codec"] }
wasm-bindgen-futures = { version = "0.4.50" }
web-time = "1.1.0"
zeroize = "1.8.1"


[dependencies]
anyhow.workspace = true
async-rt.workspace = true
async-stream.workspace = true
async-trait.workspace = true
asynchronous-codec.workspace = true
base64 = { workspace = true }
bytes = { workspace = true }
chrono.workspace = true
connexa = { workspace = true, features = ["cid"] }
either.workspace = true
futures-timeout.workspace = true
futures.workspace = true
indexmap.workspace = true
ipld-core.workspace = true
ipld-dagpb.workspace = true
libp2p-relay-manager = { workspace = true }
multibase.workspace = true
multihash.workspace = true
multihash-codetable.workspace = true
multihash-derive.workspace = true
parking_lot.workspace = true
pollable-map.workspace = true
quick-protobuf-codec.workspace = true
quick-protobuf.workspace = true
rand.workspace = true
rust-ipns = { workspace = true, features = ["libp2p"] }
rust-unixfs = { workspace = true }
serde = { features = ["derive"], workspace = true }
serde_ipld_dagcbor.workspace = true
serde_ipld_dagjson.workspace = true
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-futures = { workspace = true }
unsigned-varint.workspace = true
web-time.workspace = true
zeroize.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
futures-timer.workspace = true
fs2.workspace = true
hickory-resolver.workspace = true
rcgen = { workspace = true, optional = true }
rlimit.workspace = true
simple_x509 = { workspace = true, optional = true }
tokio = { features = ["full"], workspace = true }
tokio-stream = { workspace = true, features = ["fs"] }
tokio-util = { workspace = true, features = ["full"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
futures-timer = { workspace = true, features = ["wasm-bindgen"] }
getrandom = { workspace = true, features = ["wasm_js"] }
idb.workspace = true
send_wrapper.workspace = true
serde-wasm-bindgen.workspace = true
tokio = { default-features = false, features = ["sync", "macros"], workspace = true }
tokio-stream = { workspace = true, default-features = false }
tokio-util = { workspace = true, default-features = false }
wasm-bindgen-futures.workspace = true

[dev-dependencies]
hex-literal = { default-features = false, version = "1.0.0" }
tokio = { features = ["full"], workspace = true }
rustyline-async = { version = "0.4.6" }
tracing-subscriber = { features = ["env-filter"], version = "0.3.19" }
rand = { workspace = true }
tempfile = "3.17.1"

clap = { workspace = true }

[profile.dev.build-override]
debug = true

[workspace]
members = ["packages/*", "unixfs", "examples/*"]
exclude = ["archived"]

resolver = "2"
