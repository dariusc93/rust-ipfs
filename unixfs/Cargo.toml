[package]
authors = ["Rust-IPFS contributors"]
description = "UnixFs tree support"
edition = "2021"
license = "MIT OR Apache-2.0"
name = "rust-unixfs"
readme = "README.md"
repository = "https://github.com/dariusc93/rust-ipfs"
version = "0.5.1"

[features]
default = ["filetime"]

[dependencies]
ipld-core = "0.4.1"
ipld-dagpb = "0.2.2"
multihash = "0.19.3"
multihash-codetable = { version = "0.2.1", default-features = false, features = ["std", "sha2", "sha3", "blake2b", "blake2s", "blake3"] }
multihash-derive = "0.9.2"

either = { default-features = false, version = "1.15.0" }
filetime = { optional = true, version = "0.2.26" }
murmur3 = "=0.5.2"
quick-protobuf = { version = "0.8.1" }
sha2 = { default-features = false, version = "0.10.2" }

[dev-dependencies]
hex-literal = { default-features = false, version = "1.0.0" }
libc = { default-features = false, version = "0.2.170" }
multibase = { default-features = false, version = "0.9.2" }
tar = { default-features = false, version = "0.4.44" }
criterion = { default-features = false, version = "0.8.1" }

[[bench]]
name = "ingest-tar"
harness = false

[[bench]]
name = "adder"
harness = false
